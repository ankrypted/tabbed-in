<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="manifest.type" content="browser_action">
  <title>Tabbed In</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h3>Tabbed In</h3>
  <div id="title"></div>

  <div id="setup">
    <div class="row">
      <button data-m="5">5m</button>
      <button data-m="15">15m</button>
      <button data-m="30">30m</button>
      <button data-m="60">60m</button>
    </div>
    <div class="row">
      <input id="custom" type="number" min="1" placeholder="Custom minutes">
      <button id="go" style="flex:0 0 60px">Start</button>
    </div>
    <small>This tab will close when time runs out.</small>
  </div>

  <div id="running" class="hidden">
    <div id="remaining"></div>
    <small>To cancel early, type: <b>I am done</b></small>
    <input id="phrase" placeholder="Type the phrase to cancel">
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
